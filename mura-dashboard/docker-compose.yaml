services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=mura-dashboard'
      - 'POSTGRES_USER=mura-dashboard'
      - 'POSTGRES_PASSWORD=mura4all!'
    ports:
      - '5432:24391'
    healthcheck:
      test: [
        CMD-SHELL,
        pg_isready -U mura-dashboard
      ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
  mura-dashboard:
    image: 'muradashboard/mura-dashboard:latest'
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_SECURITY_USER_NAME=admin'
      - 'SPRING_SECURITY_USER_PASSWORD=admin'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mura-dashboard'
      - 'SPRING_DATASOURCE_USERNAME=mura-dashboard'
      - 'SPRING_DATASOURCE_PASSWORD=mura4all!'
      - 'THC_PATH=/actuator/health'
      - 'THC_PORT=8080'
    depends_on:
      postgres: {
        condition: service_healthy
      }
    healthcheck:
      test: [
        CMD,
        /workspace/health-check
      ]