apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mura-dashboard.fullname" . }}-test-connection"
  labels:
    {{- include "mura-dashboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "mura-dashboard.fullname" . }}:{{ .Values.service.port }}/actuator/health', '-q', '-O-']
  restartPolicy: Never
