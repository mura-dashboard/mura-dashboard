apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mura-dashboard.fullname" . }}
  labels:
    {{- include "mura-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  spring-security-username: {{ .Values.spring.security.username | b64enc | quote }}
  spring-security-password: {{ .Values.spring.security.password | b64enc | quote }}
  datasource-username: {{ include "mura-dashboard.datasourceUsername" . | b64enc | quote }}
  datasource-password: {{ include "mura-dashboard.datasourcePassword" . | b64enc | quote }}
