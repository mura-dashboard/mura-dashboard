# -- Number of replicas (ignored if autoscaling is enabled)
replicaCount: 1

image:
  # -- Container image repository
  repository: docker.io/muradashboard/mura-dashboard
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (defaults to the chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the default name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Whether to create a ServiceAccount
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- The name of the ServiceAccount to use (generated if not set and create is true)
  name: ""
  # -- Automount API credentials for the ServiceAccount
  automount: true

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 8080

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: mura-dashboard.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration for ingress
  tls: []
  #  - secretName: mura-dashboard-tls
  #    hosts:
  #      - mura-dashboard.local

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  # -- Enable Horizontal Pod Autoscaler
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization percentage (optional)
  # targetMemoryUtilizationPercentage: 80

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Additional volumes to add to the pod
volumes: []

# -- Additional volume mounts to add to the container
volumeMounts: []

# ============================================================================
# Application-specific configuration
# ============================================================================

# -- Name of an existing Secret containing credentials.
# If set, the chart will not create its own Secret.
# The Secret must contain keys: spring-security-username, spring-security-password,
# datasource-username, datasource-password
existingSecret: ""

spring:
  security:
    # -- Spring Security username for API authentication
    username: admin
    # -- Spring Security password for API authentication
    password: admin

# ============================================================================
# PostgreSQL (Bitnami subchart)
# ============================================================================

postgresql:
  # -- Enable the Bitnami PostgreSQL subchart
  enabled: true
  auth:
    # -- PostgreSQL database name
    database: mura-dashboard
    # -- PostgreSQL username
    username: mura-dashboard
    # -- PostgreSQL password
    password: mura4all!

# ============================================================================
# External database (used when postgresql.enabled is false)
# ============================================================================

externalDatabase:
  # -- External database host
  host: ""
  # -- External database port
  port: 5432
  # -- External database name
  database: mura-dashboard
  # -- External database username
  username: mura-dashboard
  # -- External database password
  password: ""
